scraper:
  locations:
    - "Berlin, Germany"
    - "Remote"
  search_terms:
    - "Product Designer"
    - "UX Designer"
    - "UI Designer"
    - "Interaction Designer"
  sources:
    - linkedin
    - stepstone

filter:
  include:
    titles:
      - Product Designer
      - UX Designer
      - UI Designer
      - Interaction Designer
      - UX/UI Designer
    signals:
      - mobile-first
      - consumer app
      - B2C
      - shipping speed
      - outcome thinking
      - AI-native
      - engagement
      - retention
      - startup
      - fast-paced
    experience_max_years: 4
    locations:
      - Berlin
      - Remote
      - Hybrid
  exclude:
    - pure frontend
    - engineering only
    - no design culture
    - "5+ years"
    - "5 years experience"
    - German fluency required
    - Deutschkenntnisse erforderlich
    - Deutsch fließend

notification:
  recipient_email: "liamhasson@gmail.com"
  sender_email: "liamhasson@gmail.com"

schedule:
  cron: "0 8 * * *"  # 8am daily

# --- Hunter (Phase 2) -------------------------------------------------------
# The Hunter collects + dedupes only. Real scoring happens in the Matcher.
# This permissive title gate just keeps the Jobs DB from filling with roles
# that are obviously not design (e.g. backend engineer). When in doubt it keeps
# the job — the Matcher makes the real call.
hunter:
  min_interval_seconds: 1.0        # per-host politeness (~1 req/sec)
  title_keywords:
    - design
    - designer
    - ux
    - ui
    - product design
    - brand
    - visual
    - graphic
    - creative
    - motion
    - interaction
    - research
    - growth
    - founder associate
  # Titles containing any of these are dropped even if a keyword matched above.
  title_exclude:
    - engineer        # "design engineer" is re-included below
    - engineering
    - developer
    - sales
    - account
    - marketing manager
  title_exclude_exceptions:
    - design engineer
    - ux engineer
    - frontend design

# --- Matcher (Phase 3) ------------------------------------------------------
matcher:
  alert_threshold: 60        # >= this -> alert-worthy (tuned down with Liam from 70)
  ask_threshold: 40          # this..alert-1 -> borderline, ask Liam
  # Deterministic hard-drops before spending a Claude call (working-student
  # roles are excluded per Liam; internships/Praktikum are kept and scored).
  hard_drop_title_keywords:
    - working student
    - werkstudent

# --- Usage (BUILD_BRIEF §15) -------------------------------------------------
# The agents run on Liam's Claude subscription, so they cost nothing extra.
# This limit is on the API-equivalent value of what they use, to protect his
# own Claude allowance and catch runaway loops. Telegram warns at warn_at; at
# 100% the background agents (Matcher, Researcher) pause until next month or
# until the limit is raised. The Writer keeps working: Liam starts it himself.
usage:
  monthly_limit_usd: 25
  warn_at: 0.8

# --- Messenger (Phase 4) ----------------------------------------------------
messenger:
  # A posting not seen by the Hunter for this many days is treated as gone.
  expiry_days: 3
  # Statuses that still need Liam's decision (reminded daily, can expire).
  awaiting_statuses:
    - Waiting for Liam
    - Asked Liam

