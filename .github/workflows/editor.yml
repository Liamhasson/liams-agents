name: Editor — live chat on one application

# Started by the Telegram webhook (api/telegram.py) when Liam texts, or run manually.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Notion job page id"
        required: true

# One writing session at a time.
concurrency:
  group: editor-session
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      # Claude runs on Liam's subscription through Claude Code (made with `claude setup-token`),
      # so the agents cost nothing extra. No API key here, so nothing is billed per token.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - run: python -m playwright install chromium --with-deps
      - name: Editor session
        env:
          JOB: ${{ inputs.job }}
        run: python -m agents.editor.session --job "$JOB"
