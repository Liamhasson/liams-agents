name: Director — brief Liam on one job

# Started by the Telegram webhook (api/telegram.py) when Liam taps Brief me, or run manually.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Notion job page id"
        required: true

concurrency:
  group: director-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      # Claude runs on Liam's subscription through Claude Code, so nothing is billed per token.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Research and brief
        env:
          JOB: ${{ inputs.job }}
        run: python -m agents.director.run --job "$JOB"
