name: Hourly — hunt, match, alert

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      # Claude runs on Liam's subscription through Claude Code (made with `claude setup-token`),
      # so the agents cost nothing extra. No API key here, so nothing is billed per token.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Hunt (collect + dedupe)
        run: python -m agents.hunter.run
      - name: Match (score new jobs)
        run: python -m agents.matcher.run
      - name: Alert (send to Telegram)
        run: python -m agents.messenger.send
      - name: Research (notes for approved jobs)
        run: python -m agents.researcher.run
