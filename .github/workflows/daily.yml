name: Daily — reminders + expiry

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC ≈ 08:00/09:00 Berlin
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install httpx pyyaml python-dotenv
      - name: Reminders + expiry
        run: python -m agents.messenger.reminders
