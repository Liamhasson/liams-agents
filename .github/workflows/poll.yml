name: Poll — Telegram replies

# Backup only. Taps and messages normally go straight to the Telegram webhook
# (api/telegram.py on Vercel). This does nothing while the webhook is set; run it
# by hand after `python scripts/set_telegram_webhook.py --off`.
on:
  workflow_dispatch:

# Avoid overlapping poll runs stepping on each other.
concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install httpx pyyaml python-dotenv
      - name: Poll replies
        run: python -m agents.messenger.poll
